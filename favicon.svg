<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141418"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="mf-flame" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7847"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mf-bg)" stroke="#2a2a32" stroke-width="2"/>
  <!-- Left rising poster stream -->
  <rect x="12" y="24" width="10" height="16" rx="3" fill="#f2efe9" fill-opacity="0.9"/>
  <rect x="12" y="43" width="10" height="9" rx="2.5" fill="#f2efe9" fill-opacity="0.35"/>
  <!-- Center rising flame fountain column -->
  <rect x="26" y="11" width="12" height="20" rx="3.5" fill="url(#mf-flame)"/>
  <rect x="26" y="34" width="12" height="18" rx="3.5" fill="url(#mf-flame)" fill-opacity="0.85"/>
  <!-- Right rising gold/warm stream -->
  <rect x="42" y="18" width="10" height="16" rx="3" fill="#d6ae61"/>
  <rect x="42" y="37" width="10" height="15" rx="3" fill="#f2efe9" fill-opacity="0.75"/>
</svg>
