name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check features.js
          node --check functions/_lib/tmdb.js
          node --check functions/_lib/letterboxd500.js
          node --check functions/api/discover.js
          node --check functions/api/home.js
          node --check functions/api/search.js
          node --check "functions/api/movie/[id].js"
          node --check "functions/api/movie/[id]/cast.js"
          node --check "functions/api/movie/[id]/ratings.js"
          node --check "functions/api/person/[id].js"

      - name: Run unit tests
        run: node --test tests/features.cjs
