name: Feature request
description: Suggest an improvement to Movie Fountain
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the user problem or discovery goal.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add examples or screenshots only if they contain no private data.
